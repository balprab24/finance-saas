name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktY2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_ci
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /dashboard
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /dashboard
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npm run lint

      - run: npm run db:migrate

      - run: npm test

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      # Diagnostic for browser networking failures: surface any proxy env the
      # runner image injects (Chromium honors these; Node fetch does not).
      - run: env | grep -i proxy || echo "no proxy env vars"

      # Ubuntu 24.04 runner images from July 2026 restrict unprivileged user
      # namespaces again. The sandboxed Chromium network service then fails to
      # initialize its resolver and every navigation errors with
      # ERR_NAME_NOT_RESOLVED — even IP-literal targets like 127.0.0.1. Print
      # the current setting for the record, then relax it for this job.
      - run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Diagnostic: the full-Chromium run showed dbus "Could not parse server
      # address" spam, which means a malformed DBUS_*_BUS_ADDRESS is exported
      # by the runner image. Chromium consults dbus for network state; a
      # poisoned bus address can leave it convinced the machine is offline,
      # which fails every navigation as ERR_NAME_NOT_RESOLVED.
      - run: |
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS-<unset>}"
          echo "DBUS_SYSTEM_BUS_ADDRESS=${DBUS_SYSTEM_BUS_ADDRESS-<unset>}"
          ip addr show lo || true
          cat /etc/resolv.conf || true

      - run: npm run e2e
        env:
          # Temporary diagnostic: pw:api logs every navigation hop (including
          # redirect targets), pw:browser logs the launch command and browser
          # stderr. Together they show which URL actually failed to resolve.
          DEBUG: pw:api,pw:browser

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The job runs inside the official Playwright image — the environment the
    # Playwright team tests browsers against. The July 2026 refresh of BOTH the
    # ubuntu-24.04 and ubuntu-22.04 runner images broke Chromium networking on
    # the bare runner: every navigation failed ERR_NAME_NOT_RESOLVED in ~55ms
    # (IP literals included) across old/new browser builds, sandbox on/off,
    # and with the network service in-process, while Node networking was fine.
    # The container isolates e2e from that runner-image churn. Keep the tag in
    # lockstep with the package.json @playwright/test version.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Job containers reach service containers by service name, not localhost.
      # sslmode=disable is explicit: the ephemeral CI Postgres serves no TLS,
      # and lib/db-config treats a bare non-loopback host as TLS-required.
      DATABASE_URL: postgresql://ci:ci@postgres:5432/ci?sslmode=disable
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktY2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_ci
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /dashboard
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /dashboard
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npm run lint

      - run: npm run db:migrate

      - run: npm test

      - run: npm run build

      # The image ships matching browsers; this validates the version pairing
      # and is a fast no-op when package.json and the image tag agree.
      - run: npx playwright install chromium

      - run: npm run e2e

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the job only reads the repo. Override per-step if a future
# job needs to write (e.g. deploy, comment).
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # Production-form dummy keys, deliberately: a pk_test key makes Clerk's
      # middleware treat the app as a development instance and 307 real browser
      # navigations into its dev-browser handshake on the key's frontend-API
      # domain — ci-clerk.example.com, which never resolves — so every
      # Playwright page.goto dies as ERR_NAME_NOT_RESOLVED while curl/Node
      # (no handshake path) sail through. Production instances never
      # handshake; signed-out decisions stay local and auth.protect()
      # redirects to the local /sign-in.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2ktY2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_live_ci
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /dashboard
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /dashboard
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Blocking gate: runtime dependencies must be free of high/critical vulns.
      - run: npm audit --omit=dev --audit-level=high

      # Visibility only: dev/build-toolchain advisories are surfaced but do not
      # block, since some (e.g. brace-expansion in the ESLint toolchain) have no
      # fix that avoids a breaking downgrade and never ship to production.
      - name: Audit dev dependencies (non-blocking)
        run: npm audit --audit-level=high || true

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run db:migrate

      - run: npm test

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npm run e2e
